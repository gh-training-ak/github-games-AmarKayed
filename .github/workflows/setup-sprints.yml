name: Setup Sprint Projects and Issue

on:
  push:
    branches: [ "copilot/propose-enhancement-to-repo" ]
    paths: [ ".github/workflows/setup-sprints.yml" ]
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  repository-projects: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: gh-training-ak/github-games-AmarKayed
      OWNER: gh-training-ak
    steps:
      - name: Create High Score Enhancement Issue
        id: create_issue
        run: |
          ISSUE_URL=$(gh issue create \
            --repo "$REPO" \
            --title "Enhancement: Add persistent high score tracking" \
            --body "## Summary

          This issue tracks the implementation of a persistent high score feature for the JavaScript Tetris game.

          ## Problem

          Currently, the game resets the score to zero every time the page is refreshed or a new game starts. Players have no way to track their best performance across sessions.

          ## Proposed Implementation

          Add a high score feature that persists across browser sessions using the \`localStorage\` Web API:

          - Display a **best** score next to the current score in the game menu (styled in gold/goldenrod colour)
          - On game start, load the saved high score from \`localStorage\`
          - When a game ends (\`lose()\`), compare the current score to the high score; if the current score is higher, save it to \`localStorage\` and refresh the display
          - Follow the existing invalidation/rendering pattern: add \`invalidateHighScore()\` and \`drawHighScore()\` functions

          ## Acceptance Criteria

          - [ ] A **best** label with a zero-padded 5-digit score is visible in the game menu
          - [ ] The high score persists after a full page reload
          - [ ] The high score updates automatically when the player sets a new record
          - [ ] The display uses the same zero-padded 5-digit format as the current score")
          echo "ISSUE_URL=$ISSUE_URL" >> $GITHUB_OUTPUT
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "Created issue #$ISSUE_NUMBER at $ISSUE_URL"

      - name: Get organisation node ID
        id: org
        run: |
          ORG_ID=$(gh api graphql -f query='query { organization(login: "'"$OWNER"'") { id } }' --jq '.data.organization.id')
          echo "ORG_ID=$ORG_ID" >> $GITHUB_OUTPUT

      - name: Create Sprint 1 Project
        id: sprint1
        run: |
          PROJECT=$(gh api graphql -f query='mutation {
            createProjectV2(input: {ownerId: "'"${{ steps.org.outputs.ORG_ID }}"'", title: "Sprint 1"}) {
              projectV2 { id number }
            }
          }' --jq '.data.createProjectV2.projectV2')
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id')
          PROJECT_NUMBER=$(echo "$PROJECT" | jq -r '.number')
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "Created Sprint 1 project #$PROJECT_NUMBER"

      - name: Add new issue to Sprint 1
        run: |
          ISSUE_ID=$(gh api repos/$REPO/issues/${{ steps.create_issue.outputs.ISSUE_NUMBER }} --jq '.node_id')
          gh api graphql -f query='mutation {
            addProjectV2ItemById(input: {projectId: "'"${{ steps.sprint1.outputs.PROJECT_ID }}"'", contentId: "'"$ISSUE_ID"'"}) {
              item { id }
            }
          }'
          echo "Added issue #${{ steps.create_issue.outputs.ISSUE_NUMBER }} to Sprint 1"

      - name: Create Sprint 0 Project
        id: sprint0
        run: |
          PROJECT=$(gh api graphql -f query='mutation {
            createProjectV2(input: {ownerId: "'"${{ steps.org.outputs.ORG_ID }}"'", title: "Sprint 0"}) {
              projectV2 { id number }
            }
          }' --jq '.data.createProjectV2.projectV2')
          PROJECT_ID=$(echo "$PROJECT" | jq -r '.id')
          PROJECT_NUMBER=$(echo "$PROJECT" | jq -r '.number')
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "PROJECT_NUMBER=$PROJECT_NUMBER" >> $GITHUB_OUTPUT
          echo "Created Sprint 0 project #$PROJECT_NUMBER"

      - name: Add existing issues to Sprint 0
        run: |
          for ISSUE_NUM in 1 2; do
            ISSUE_ID=$(gh api repos/$REPO/issues/$ISSUE_NUM --jq '.node_id')
            gh api graphql -f query='mutation {
              addProjectV2ItemById(input: {projectId: "'"${{ steps.sprint0.outputs.PROJECT_ID }}"'", contentId: "'"$ISSUE_ID"'"}) {
                item { id }
              }
            }'
            echo "Added issue #$ISSUE_NUM to Sprint 0"
          done
